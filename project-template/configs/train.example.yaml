# 실제 모델이 확정되기 전 사용하는 예시 설정이다.
project:
  name: cal-projection-enhancement
  seed: 42

data:
  # 학습에 필요한 데이터만 S3에서 Local NVMe/EBS로 내려받아 사용한다.
  s3_prefix: datasets/train/
  cache_dir: /workspace/cache
  num_workers: 4

training:
  # Batch size는 VRAM 사용량을 측정한 뒤 조정한다.
  batch_size: 4
  epochs: 1000
  learning_rate: 0.0001

checkpoint:
  # 중단 복구를 위해 일정 epoch마다 EBS에 저장한 뒤 S3로 동기화한다.
  every_epochs: 10
  local_dir: /workspace/cal-project/checkpoints
  s3_prefix: checkpoints/
